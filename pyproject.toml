[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectro-gui-pipeline"
version = "0.1.2"
description = "GUI and batch pipeline for spectrophotometer transmittance/scattering analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.scripts]
spectro-analysis = "spectro_app.cli:main"
spectro-gui = "spectro_app.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectro_app*"]
